name: 打包发布
on:
  workflow_dispatch:
    inputs:
      version:
        description: 与工程版本一致的发布版本（不带 v）
        required: true
        default: '1.0.2'
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  package:
    name: package (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RUST_TARGET: ${{ matrix.target }}
      BUNDLE_FORMATS: ${{ matrix.bundles }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb dbus-x11
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target "$RUST_TARGET"
      - run: npm ci
      - name: 检查版本与格式
        run: |
          node -e 'const p=require("./package.json"),t=require("./src-tauri/tauri.conf.json");if(!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION)||p.version!==process.env.RELEASE_VERSION||t.version!==p.version)process.exit(1)'
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: 核心测试
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET"
      - name: 生成第三方依赖声明
        run: python scripts/third_party_notices.py --target "$RUST_TARGET"
      - name: 生成发布安装包
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri -- build --target "$RUST_TARGET" --bundles "$BUNDLE_FORMATS"
      - name: 检查架构与收集产物
        run: python scripts/collect_release.py --platform "$RELEASE_PLATFORM" --target "$RUST_TARGET" --version "$RELEASE_VERSION"
      - name: 安装包结构与启动烟测
        run: python scripts/smoke_package.py --platform "$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    name: 创建 Release 草稿
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: 校验全部产物
        run: python3 scripts/finalize_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: 创建预览版草稿并上传
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          notes="doc/releases/$RELEASE_VERSION.md"
          test -f "$notes"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "$RELEASE_VERSION 预览版" --notes-file "$notes"
          fi
          gh release upload "$tag" release-assets/* --clobber
